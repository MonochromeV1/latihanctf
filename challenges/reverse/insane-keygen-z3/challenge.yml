description: |
  A license keygen with a system of modular-arithmetic constraints on the key
  bytes plus a checksum. Solve it however you like — an SMT solver makes short
  work of it. The flag is derived from the key, so guessing won't help.

  The claude{...} you can `strings` out is a decoy.
